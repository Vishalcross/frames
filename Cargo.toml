[workspace]
members = [
    "crates/frames-core",
    "crates/frames-ffi",
    "frames-shell/src-tauri",
]
resolver = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: decoders run on arbitrary user files, and a panic on one
# corrupt photo must fail that photo, not close the app.
panic = "unwind"
strip = true

# The Mac app's Rust library (scripts/build-core-xcframework.sh): release, but
# unstripped, because uniffi-bindgen reads its metadata from the symbols.
[profile.ffi]
inherits = "release"
strip = false
