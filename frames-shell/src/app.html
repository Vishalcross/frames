<!doctype html>
<html lang="en" data-appearance="standard" data-scheme="light" data-glass-tier="1" data-reduce-transparency="false" data-contrast="normal">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frames</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('frames_theme_config');
          if (raw) {
            var cfg = JSON.parse(raw);
            var root = document.documentElement;
            if (cfg.appearance) root.setAttribute('data-appearance', cfg.appearance);
            var scheme = cfg.scheme;
            if (scheme === 'system') {
              scheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            if (scheme) root.setAttribute('data-scheme', scheme);
            if (cfg.accent) root.setAttribute('data-accent', cfg.accent);
            if (cfg.reduceTransparency) root.setAttribute('data-reduce-transparency', 'true');
          }
        } catch(e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
