[package]
name = "frames-ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Swift bindings for frames-core (frames_swift_spec.md section 5)"

[lib]
name = "frames_ffi"
# staticlib for the Mac app; cdylib only so uniffi-bindgen can read the metadata.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
base64 = "0.23"
chrono = "0.4"
dirs = "7"
frames-core = { path = "../frames-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.32", features = ["cli"] }
