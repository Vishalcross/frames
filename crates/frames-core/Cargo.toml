[package]
name = "frames-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Frames core logic: bucket keys, dates, change-log types, local schema. No I/O, no UI."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Used only to prove schema.sql loads (FTS5 included) on every machine.
rusqlite = { version = "0.32", features = ["bundled"] }
