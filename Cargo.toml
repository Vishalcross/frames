[workspace]
members = [
    "crates/frames-core",
    "frames-shell/src-tauri",
]
resolver = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: decoders run on arbitrary user files, and a panic on one
# corrupt photo must fail that photo, not close the app.
panic = "unwind"
strip = true
